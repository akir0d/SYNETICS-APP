<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Icone de Dernier Bastion. Grille d'icone adaptative Android : 108 unites,
       tout l'essentiel tient dans le cercle central de rayon 33.
       #bg = fond, #fg = premier plan. Regenerer : node tools/icons.cjs -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#4c7a3e"/>
      <stop offset="1" stop-color="#1a3020"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd66b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffd66b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="bg"><rect width="108" height="108" fill="url(#sky)"/></g>
  <g id="fg">
    <circle cx="54" cy="42" r="27" fill="url(#halo)"/>
    <circle cx="54" cy="42" r="15.5" fill="#ffd66b"/>
    <circle cx="49" cy="38" r="3" fill="#f2bf4c"/>
    <circle cx="60" cy="46" r="2.2" fill="#f2bf4c"/>
