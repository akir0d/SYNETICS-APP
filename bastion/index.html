<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfd2cf" />
    <title>Dernier Bastion</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="vignette"></div>
    <div class="labels"><div class="hpbar hidden"><i></i></div></div>
    <header class="hud">
      <div class="clock"><span class="ci">☀️</span><span class="ct">Jour 1</span><div class="cbar"><i></i></div></div>
      <div class="purse">
        <div class="money"><span class="coin"></span><b>0</b></div>
        <div class="gems"><span>💎</span><b>0</b></div>
        <div class="bag"><span>🎒</span><b>0/8</b></div>
      </div>
    </header>
    <div class="objective"><span class="oi">🥕</span><span class="ot">Récolte des carottes</span></div>
    <button class="menu-btn" aria-label="Menu">⚙️</button>
    <button class="shop-btn" aria-label="Boutique">🛒<i class="dot"></i></button>
    <div class="boost-bar"></div>
    <button class="ad-pill off"></button>
    <div class="menu">
      <div class="m-title">Dernier Bastion</div>
      <button class="m-sound">🔊 Son activé</button>
      <button class="m-reset">Recommencer le camp</button>
    </div>
    <section class="sheet"><div class="sheet-handle" aria-label="Replier ou deplier"><i></i><b class="sheet-title"></b></div><div class="sheet-body"></div></section>
    <div class="hint">Glisse le doigt pour marcher</div>
    <div class="joy"><div class="joy-knob"></div></div>
    <section class="shop">
      <div class="shop-card">
        <div class="shop-head">
          <div class="shop-tabs"><button data-tab="shop" class="on">🛒 Boutique</button><button data-tab="quests">📜 Quêtes<i class="dot"></i></button><button data-tab="city">🏙️ Ville<i class="dot"></i></button></div>
          <button class="shop-close" aria-label="Fermer">✕</button>
        </div>
        <div class="shop-body"></div>
      </div>
    </section>
    <div class="toast"></div>
    <div class="modal"></div>
    <div id="boot-load" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:90;display:grid;place-items:center;background:#1c2a20;color:#f6e9d2;font:800 20px/1.3 sans-serif;text-align:center">
      <div>Dernier Bastion<br><span id="boot-step" style="font-size:14px;opacity:.75">Chargement…</span></div>
    </div>
    <script>
      // Diagnostic du demarrage : chaque etape est notee. Si un lancement bloque ou plante,
      // le suivant affiche ou il s'est arrete, au lieu d'un ecran vide.
      (function () {
        var KEY = 'dernier-bastion.boot';
        var t0 = Date.now();
        var prev = null;
        try { prev = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { prev = null; }
        function save(o) { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
        var cur = { ok: false, step: 'page', t: 0, err: '' };
        function show(msg) {
          var d = document.getElementById('boot-error');
          if (!d) {
            d = document.createElement('div');
            d.id = 'boot-error';
            d.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;padding:12px;border-radius:12px;background:#3a1a12;color:#fff;font:13px/1.35 monospace;white-space:pre-wrap;word-break:break-word';
            document.body.appendChild(d);
          }
          d.textContent = msg + '\n\n' + navigator.userAgent + '\n\nEnvoie une capture de ce message.';
        }
        window.__bootStep = function (s) {
          cur.step = s; cur.t = Date.now() - t0; save(cur);
          var el = document.getElementById('boot-step');
          if (el) el.textContent = s + '…';
        };
        window.__bootDone = function () {
          save({ ok: true, t: Date.now() - t0 });
          var l = document.getElementById('boot-load');
          if (l) l.remove();
        };
        window.addEventListener('error', function (e) {
          cur.err = String(e.message) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ':' + e.colno + ')' : '');
          save(cur);
          show('Le jeu a planté à l\'étape « ' + cur.step + ' » :\n' + cur.err);
        });
        window.addEventListener('unhandledrejection', function (e) { show('Promesse rejetée : ' + String(e.reason)); });
        // Affiche tout de suite (pas a DOMContentLoaded : il attend le jeu, qui peut bloquer).
        if (prev && !prev.ok) show('Le lancement précédent s\'est arrêté à l\'étape « ' + prev.step + ' » après ' + Math.round(prev.t / 1000) + ' s.' + (prev.err ? '\nErreur : ' + prev.err : ''));
        save(cur);
        // Au bout de 25 s sans premiere image, on le dit (si la page repond encore).
        setTimeout(function () { if (document.getElementById('boot-load')) show('Toujours en chargement après 25 s, étape « ' + cur.step + ' ».'); }, 25000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
