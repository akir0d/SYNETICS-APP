<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#bfd2cf" />
    <title>Dernier Bastion</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="labels"><div class="hpbar hidden"><i></i></div></div>
    <header class="hud">
      <div class="clock"><span class="ci">☀️</span><span class="ct">Jour 1</span><div class="cbar"><i></i></div></div>
      <div class="purse">
        <div class="money"><span class="coin"></span><b>0</b></div>
        <div class="gems"><span>💎</span><b>0</b></div>
        <div class="bag"><span>🎒</span><b>0/8</b></div>
      </div>
    </header>
    <div class="objective"><span class="oi">🥕</span><span class="ot">Récolte des carottes</span></div>
    <button class="menu-btn" aria-label="Menu">⚙️</button>
    <button class="shop-btn" aria-label="Boutique">🛒<i class="dot"></i></button>
    <div class="boost-bar"></div>
    <div class="menu">
      <button class="m-sound">🔊 Son activé</button>
      <button class="m-reset">Recommencer le camp</button>
    </div>
    <section class="sheet"><div class="sheet-body"></div></section>
    <div class="hint">Glisse le doigt pour marcher</div>
    <div class="joy"><div class="joy-knob"></div></div>
    <section class="shop">
      <div class="shop-card">
        <div class="shop-head">
          <div class="shop-tabs"><button data-tab="shop" class="on">🛒 Boutique</button><button data-tab="quests">📜 Quêtes<i class="dot"></i></button></div>
          <button class="shop-close" aria-label="Fermer">✕</button>
        </div>
        <div class="shop-body"></div>
      </div>
    </section>
    <div class="toast"></div>
    <div class="modal"></div>
    <script>
      // Si le jeu plante au demarrage, on affiche l'erreur au lieu d'un ecran vide.
      (function () {
        function show(msg) {
          if (document.getElementById('boot-error')) return;
          var d = document.createElement('div');
          d.id = 'boot-error';
          d.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:99;padding:12px;border-radius:12px;background:#3a1a12;color:#fff;font:13px/1.35 monospace;white-space:pre-wrap;word-break:break-word';
          d.textContent = 'Le jeu n\'a pas pu demarrer. Envoie une capture de ce message :\n\n' + msg + '\n\n' + navigator.userAgent;
          document.body.appendChild(d);
        }
        window.addEventListener('error', function (e) { show(String(e.message) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
        window.addEventListener('unhandledrejection', function (e) { show('Promesse : ' + String(e.reason)); });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
